name: Fix Supabase persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-storage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove destructive stale-record deletion
        shell: python
        run: |
          from pathlib import Path
          p = Path('karuruma-health-post.jsx')
          s = p.read_text()
          old = '''    const stale = (existing.data || []).map(r => r.id).filter(id => !ids.includes(id));
    if (stale.length) { const { error } = await supabase.from(table).delete().in("id", stale); if (error) throw error; }
    if (rows.length) { const { error } = await supabase.from(table).upsert(rows, { onConflict: "id" }); if (error) throw error; }'''
          new = '''    // Supabase is the source of truth for shared clinic data. Never delete
    // records simply because this device has an incomplete array.
    if (rows.length) { const { error } = await supabase.from(table).upsert(rows, { onConflict: "id" }); if (error) throw error; }'''
          if old not in s:
              raise SystemExit('Expected persistence block was not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit corrected persistence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karuruma-health-post.jsx
          git commit -m "Fix shared Supabase data persistence" || exit 0
          git push
