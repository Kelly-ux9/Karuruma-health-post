name: Restore Known Good App

on:
  push:
    paths:
      - '.github/workflows/restore-and-fix-persistence.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Restore application source
        run: git checkout 5c6108cd756be3d8983bd4a369895552663ec70f -- karuruma-health-post.jsx

      - name: Verify application source
        run: |
          test -s karuruma-health-post.jsx
          grep -q 'export default function KarurumaHealthPost' karuruma-health-post.jsx
          wc -c karuruma-health-post.jsx

      - name: Commit restored source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karuruma-health-post.jsx
          git commit -m 'Restore working application source' || exit 0
          git push origin HEAD:main
